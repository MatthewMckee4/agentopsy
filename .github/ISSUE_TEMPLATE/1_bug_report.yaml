name: Bug report
description: Report an error or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! We're glad to have you involved with Agentopsy.

        **Before reporting, please search [existing issues](https://github.com/MatthewMckee4/agentopsy/issues?q=is:issue+is:open+label:bug), including [closed issues](https://github.com/MatthewMckee4/agentopsy/issues?q=is:issue%20state:closed%20label:bug).**

  - type: textarea
    attributes:
      label: Summary
      description: |
        A clear and concise description of the bug, including a minimal reproducible example.

        Include how Agentopsy was started, the complete terminal output, and the
        affected session's Diagnostics and Event inventory. Redact trace content,
        commands, and paths that contain secrets.

    validations:
      required: true

  - type: input
    attributes:
      label: Platform
      description: What operating system and architecture are you using? (see `uname -orsm`)
      placeholder: e.g., macOS 15 arm64, Windows 11 x86_64, Ubuntu 24.04 amd64
    validations:
      required: true

  - type: input
    attributes:
      label: Version
      description: What Agentopsy version or commit are you using?
      placeholder: e.g., Agentopsy 0.1.0 or commit abc1234
    validations:
      required: true
