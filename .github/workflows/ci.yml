name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  RUSTUP_MAX_RETRIES: 10

jobs:
  determine_changes:
    name: "determine changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      code: ${{ steps.check_code.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine merge base
        id: merge_base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          sha=$(git merge-base HEAD "origin/${BASE_REF}")
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check for code changes
        id: check_code
        env:
          MERGE_BASE: ${{ steps.merge_base.outputs.sha }}
        run: |
          if git diff --quiet "${MERGE_BASE}...HEAD" -- \
            . \
            ':!.gitattributes' \
            ':!.github/CODEOWNERS' \
            ':!.github/CODE_OF_CONDUCT.md' \
            ':!.github/FUNDING.yml' \
            ':!.github/ISSUE_TEMPLATE/**' \
            ':!.github/PULL_REQUEST_TEMPLATE.md' \
            ':!.github/actionlint.yaml' \
            ':!.github/renovate.json5' \
            ':!.github/zizmor.yml' \
            ':!.markdownlint.yaml' \
            ':!.pre-commit-config.yaml' \
            ':!AGENTS.md' \
            ':!CHANGELOG.md' \
            ':!CODE_OF_CONDUCT.md' \
            ':!CONTRIBUTING.md' \
            ':!LICENSE' \
            ':!README.md' \
            ':!SECURITY.md' \
            ':!justfile' \
            ':!seal.toml' \
          ; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    name: "pre commit"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6

  cargo-fmt:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust formatter
        run: rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  cargo-clippy:
    name: "cargo clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Clippy
        run: rustup component add clippy

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  cargo-shear:
    name: "cargo shear"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo shear
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-shear@1.12.4

      - name: Check unused dependencies
        run: cargo shear --deny-warnings

  cargo-test:
    name: "cargo test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: determine_changes
    if: ${{ needs.determine_changes.outputs.code == 'true' || github.ref == 'refs/heads/main' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Install cargo nextest
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --locked --profile ci

  ci-gate:
    name: "CI gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - determine_changes
      - pre-commit
      - cargo-fmt
      - cargo-clippy
      - cargo-shear
      - cargo-test
    if: ${{ always() }}

    steps:
      - name: Require successful validation
        env:
          CARGO_CLIPPY_RESULT: ${{ needs.cargo-clippy.result }}
          CARGO_FMT_RESULT: ${{ needs.cargo-fmt.result }}
          CARGO_SHEAR_RESULT: ${{ needs.cargo-shear.result }}
          CARGO_TEST_RESULT: ${{ needs.cargo-test.result }}
          CODE_CHANGED: ${{ needs.determine_changes.outputs.code }}
          DETERMINE_CHANGES_RESULT: ${{ needs.determine_changes.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
        run: |
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 finished with result '$2'"
              exit 1
            fi
          }

          require_code_validation() {
            case "$2" in
              success)
                ;;
              skipped)
                if [ "$CODE_CHANGED" != "false" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
                  echo "::error::$1 was unexpectedly skipped"
                  exit 1
                fi
                ;;
              *)
                echo "::error::$1 finished with result '$2'"
                exit 1
                ;;
            esac
          }

          require_success "determine changes" "$DETERMINE_CHANGES_RESULT"
          require_success "pre commit" "$PRE_COMMIT_RESULT"

          if [ "$CODE_CHANGED" != "true" ] && [ "$CODE_CHANGED" != "false" ]; then
            echo "::error::determine changes produced unexpected code output '$CODE_CHANGED'"
            exit 1
          fi

          require_code_validation "cargo fmt" "$CARGO_FMT_RESULT"
          require_code_validation "cargo clippy" "$CARGO_CLIPPY_RESULT"
          require_code_validation "cargo shear" "$CARGO_SHEAR_RESULT"
          require_code_validation "cargo test" "$CARGO_TEST_RESULT"
