name: Build binaries

on:
  workflow_call:

  pull_request:
    paths:
      - .cargo/config.toml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - src/**
      - .github/workflows/build-binaries.yml

permissions: {}

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    name: "build binary (${{ matrix.artifact }})"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-15
            artifact: macos-aarch64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build binary
        run: cargo build --release --locked

      - name: Stage binary
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/agentopsy.exe "dist/agentopsy-${ARTIFACT}.exe"
          else
            cp target/release/agentopsy "dist/agentopsy-${ARTIFACT}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.artifact }}
          path: dist
