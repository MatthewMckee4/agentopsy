name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., 1.0.0)"
        required: true
        default: dry-run
        type: string

permissions: {}

env:
  # renovate: datasource=github-releases depName=MatthewMckee4/seal
  SEAL_VERSION: 0.0.1-alpha.8

jobs:
  generate-release:
    name: Generate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-metadata: ${{ steps.seal-generate.outputs.metadata }}
      tag: ${{ inputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install seal
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/MatthewMckee4/seal/releases/download/${SEAL_VERSION}/seal-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Generate release metadata
        id: seal-generate
        run: |
          metadata=$(seal generate release)
          {
            echo "metadata<<EOF"
            echo "$metadata"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build binaries
    needs: generate-release
    uses: ./.github/workflows/build-binaries.yml

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [generate-release, build-binaries]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Parse release metadata
        id: parse-metadata
        env:
          METADATA: ${{ needs.generate-release.outputs.release-metadata }}
        run: |
          title=$(echo "$METADATA" | jq -r '.title')
          body=$(echo "$METADATA" | jq -r '.body')
          prerelease=$(echo "$METADATA" | jq -r '.prerelease')

          {
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "$body" > "$RUNNER_TEMP/release-notes.txt"

      - name: Create GitHub release
        env:
          PRERELEASE: ${{ steps.parse-metadata.outputs.prerelease }}
          TAG: ${{ needs.generate-release.outputs.tag }}
          TITLE: ${{ steps.parse-metadata.outputs.title }}
        run: |
          args=(
            "$TAG"
            --title "$TITLE"
            --notes-file "$RUNNER_TEMP/release-notes.txt"
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          args+=(dist/*)
          gh release create "${args[@]}"
